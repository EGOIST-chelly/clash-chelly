# chelly

# 机场节点订阅

proxy-providers:

  Airport-1:
    url: "机场链接"
    type: http
    interval: 43200
    override:
      additional-prefix: '[吹雪云]'
      skip-cert-verify: true
      udp: true
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180  
    proxy: 直连 
    
  Airport-2:
    url: "机场链接"
    type: http
    interval: 43200
    override:
      additional-prefix: '[赔钱]'
      skip-cert-verify: true
      udp: true
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
    proxy: 直连   

  Airport-3:
    url: "粘贴机场订阅地址"
    type: http
    interval: 43200
    override:
      additional-prefix: '[机场3名字]'
      skip-cert-verify: true
      udp: true
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
    proxy: 直连    

  Airport-4:
    url: "粘贴机场订阅地址"
    type: http
    interval: 43200
    override:
      additional-prefix: '[机场4名字]'
      skip-cert-verify: true
      udp: true
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
    proxy: 直连        
  

proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info

external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
secret: "123456"

# ========================
# DNS 设置
# ========================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  nameserver:
    - 223.5.5.5
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn
    - +.ifaner.dd94wan.com

ipv6: true

# ========================
# TUN 模块
# ========================
tun:
  enable: true
  stack: gvisor
  device: utun
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false

profile:
  store-selected: true
  store-fake-ip: true

# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - 直连
    - 自动-故转
    - 日本-故转
    - 新加坡-故转
    - 美国-故转
    - 其他地区
    - 所有-自动
    - 拒绝

proxy-groups:

  # 自动组
  - name: 自动-故转
    icon: "https://raw.githubusercontent.com/ifanrBook/ClashConfig/refs/heads/main/icon/network-pin.png"
    type: fallback
    interval: 180
    lazy: false
    proxies:
      - 日本-手动
      - 日本-自动
      - 新加坡-手动
      - 新加坡-自动
      - 美国-手动
      - 美国-自动
      - 所有-自动

  - name: 剩余流量
    icon: https://raw.githubusercontent.com/ifanrBook/ClashConfig/refs/heads/main/icon/network-user.png
    type: select
    include-all: true
    filter: "(?=.*(剩余|流量|套餐|到期)).*$"
 
  - {name: 国外网站, <<: *default, icon: "https://raw.githubusercontent.com/ifanrBook/ClashConfig/refs/heads/main/icon/rocket-earth.png"} 
  

  # 业务分流组
  - {name: ChatGPT, <<: *default, icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png"}
  - {name: Check, <<: *default, icon: "https://raw.githubusercontent.com/Lanlan13-14/Rules/refs/heads/main/icon/speedtest.png"}
  - {name: 国内网站, <<: *default, icon: "https://raw.githubusercontent.com/ifanrBook/ClashConfig/refs/heads/main/icon/China.png"}
  - {name: 漏网之鱼, <<: *default, icon: "https://raw.githubusercontent.com/Lanlan13-14/Rules/refs/heads/main/icon/final.png"}

  # 日本组
  - name: 日本-故转
    icon: "https://raw.githubusercontent.com/Lanlan13-14/Rules/refs/heads/main/icon/Japan.png"
    type: fallback
    hidden: true
    interval: 180
    lazy: false
    proxies:
      - 日本-手动
      - 日本-自动
  - name: 日本-手动
    icon: https://raw.githubusercontent.com/Lanlan13-14/Rules/refs/heads/main/icon/Japan.png
    type: select
    include-all: true
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"
  - name: 日本-自动
    icon: https://raw.githubusercontent.com/ifanrBook/ClashConfig/refs/heads/main/icon/dashboard.png
    type: url-test
    hidden: true
    include-all: true
    tolerance: 30
    interval: 180
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"

  # 新加坡组
  - name: 新加坡-故转
    icon: "https://raw.githubusercontent.com/Lanlan13-14/Rules/refs/heads/main/icon/Singapore.png"
    type: fallback
    hidden: true
    interval: 180
    lazy: false
    proxies:
      - 新加坡-手动
      - 新加坡-自动
  - name: 新加坡-手动
    icon: https://raw.githubusercontent.com/Lanlan13-14/Rules/refs/heads/main/icon/Singapore.png
    type: select
    include-all: true
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"
  - name: 新加坡-自动
    icon: https://raw.githubusercontent.com/ifanrBook/ClashConfig/refs/heads/main/icon/dashboard.png
    type: url-test
    hidden: true
    include-all: true
    tolerance: 30
    interval: 180
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"
    
  # 美国组
  - name: 美国-故转
    icon: "https://raw.githubusercontent.com/Lanlan13-14/Rules/refs/heads/main/icon/America.png"
    type: fallback
    hidden: true
    interval: 180
    lazy: false
    proxies:
      - 美国-手动
      - 美国-自动
  - name: 美国-手动
    icon: https://raw.githubusercontent.com/Lanlan13-14/Rules/refs/heads/main/icon/America.png
    type: select
    include-all: true
    filter: "(?=.*(广美|美|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"
  - name: 美国-自动
    icon: https://raw.githubusercontent.com/ifanrBook/ClashConfig/refs/heads/main/icon/dashboard.png
    type: url-test
    hidden: true
    include-all: true
    tolerance: 30
    interval: 180
    filter: "(?=.*(广美|美|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"

  # 其他地区组
  - name: 其他地区
    icon: "https://raw.githubusercontent.com/Lanlan13-14/Rules/refs/heads/main/icon/global.png"
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广美|美|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|剩余|流量|套餐|到期)).)*$"
    
  - name: 所有-自动
    icon: "https://raw.githubusercontent.com/ifanrBook/ClashConfig/refs/heads/main/icon/earth-setting.png"
    type: url-test
    include-all: true
    tolerance: 30
    interval: 180
    filter: "^((?!(直连|拒绝|剩余|流量|套餐|到期)).)*$"

# ========================
# 规则引擎（rules）
# ========================
rules:

  - RULE-SET,Check / Domain,Check
  - RULE-SET,ChatGPT / Domain,ChatGPT
  - RULE-SET,Claude / Domain,ChatGPT
  - RULE-SET,AI / Domain,ChatGPT
  - GEOSITE,steam@cn,直连
  - DOMAIN-SUFFIX,steamserver.net,直连
  - RULE-SET,applications / Domain,国内网站
  - DOMAIN,clash.razord.top,国内网站
  - DOMAIN,yacd.haishan.me,国内网站
  - RULE-SET,private / Domain,国内网站
  - RULE-SET,reject / Domain,拒绝
  - RULE-SET,icloud / Domain,国内网站
  - RULE-SET,apple / Domain,国内网站
  - RULE-SET,Google / Domain,国外网站
  - RULE-SET,Google / IP,国外网站,no-resolve
  - RULE-SET,proxy / Domain,国外网站
  - RULE-SET,direct / Domain,国内网站
  - RULE-SET,telegramcidr / IP,国外网站,no-resolve
  - RULE-SET,lancidr / IP,国内网站,no-resolve
  - RULE-SET,cncidr / IP,国内网站,no-resolve
  - GEOIP,LAN,国内网站
  - GEOIP,CN,国内网站
  - MATCH,漏网之鱼

# ========================
# 规则集提供者
# ========================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: yaml}
  ip-mrs: &ip-mrs {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  class-text: &class-text {type: http, interval: 86400, behavior: classical, format: text}
  class: &class {type: http, interval: 86400, behavior: classical, format: yaml}
  domain-yaml: &domain-yaml {type: http, interval: 86400, behavior: domain, format: yaml}
  domain-mrs: &domain-mrs {type: http, interval: 86400, behavior: domain, format: mrs}
  
rule-providers:
  Check / Domain: {<<: *class-text, url: "https://raw.githubusercontent.com/EGOIST-chelly/clash-chelly/refs/heads/main/list/check.list"}
  ChatGPT / Domain: {<<: *domain-mrs, url: "https://raw.githubusercontent.com/metacubex/meta-rules-dat/refs/heads/meta/geo/geosite/openai.mrs"}
  Claude / Domain: {<<: *class-text, url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Claude/Claude.list"}
  AI / Domain: {<<: *domain-mrs, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/category-ai-!cn.mrs"}
  reject / Domain: {<<: *domain-yaml, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt", path: ./ruleset/reject.yaml}
  icloud / Domain: {<<: *domain-yaml, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt", path: ./ruleset/icloud.yaml}
  apple / Domain: {<<: *domain-yaml, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt", path: ./ruleset/apple.yaml}
  Google / Domain: {<<: *domain-mrs, url: "https://raw.githubusercontent.com/metacubex/meta-rules-dat/refs/heads/meta/geo/geosite/google.mrs"}
  Google / IP: {<<: *ip-mrs, url: "https://raw.githubusercontent.com/metacubex/meta-rules-dat/refs/heads/meta/geo/geoip/google.mrs"}
  proxy / Domain: {<<: *domain-yaml, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt", path: ./ruleset/proxy.yaml}
  direct / Domain: {<<: *domain-yaml, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt", path: ./ruleset/direct.yaml}
  private / Domain: {<<: *domain-yaml, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt", path: ./ruleset/private.yaml}
  gfw / Domain: {<<: *domain-yaml, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt", path: ./ruleset/gfw.yaml}
  tld-not-cn / Domain: {<<: *domain-yaml, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt", path: ./ruleset/tld-not-cn.yaml}
  telegramcidr / IP: {<<: *ip, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt", path: ./ruleset/telegramcidr.yaml}
  cncidr / IP: {<<: *ip, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt", path: ./ruleset/cncidr.yaml}
